[project]
name = "learn-reward-api"
version = "0.1.0"
description = "Learn-and-Reward-LAR API (modular monolith). Mission B scope: learning + ai_chat modules."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    # Mission A (Developer A scope): resource layer + voice AI
    "faster-whisper>=1.0",
    "fastembed>=0.3",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
queue = [
    "rq>=1.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "UP042", # (str, Enum) kept for explicit SQLAlchemy Enum compatibility
    "B905",  # zip() strictness not needed in compact test helpers
    "E741",  # single-letter vars in compact test fixtures
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
